<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ladder — build your ranking by dragging</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12151a;
    --surface: #1c2028;
    --surface-2: #262b35;
    --line: #313846;
    --text: #edeef0;
    --text-dim: #8b92a1;
    --accent: #d4a73d;
    --accent-soft: #3a3320;
    --accent-2: #5c9b97;
    --danger: #c96a5c;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after{ box-sizing: inherit; }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body{ height: 100%; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }
  .wrap{
    max-width: 620px;
    margin: 0 auto;
    padding: 40px 20px 100px;
  }
  .brand{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 30px;
  }
  .brand h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 26px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .brand .count{
    font-size: 13px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  button{
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    border: none;
    outline: none;
  }
  .btn-primary{
    background: var(--accent);
    color: #1a1607;
    font-weight: 600;
    font-size: 15px;
    padding: 13px 22px;
    border-radius: 8px;
    transition: filter .12s ease, transform .12s ease;
    white-space: nowrap;
  }
  .btn-primary:hover{ filter: brightness(1.08); }
  .btn-primary:active{ transform: scale(.97); }
  .btn-ghost{
    background: transparent;
    color: var(--text-dim);
    font-size: 13px;
    padding: 9px 15px;
    border-radius: 8px;
    border: 1px solid var(--line);
    transition: border-color .12s ease, color .12s ease;
  }
  .btn-ghost:hover{ border-color: var(--text-dim); color: var(--text); }
  .btn-ghost:disabled{ opacity: .4; cursor: not-allowed; }

  .section-label{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-style: italic;
    font-size: 17px;
    color: var(--text-dim);
    margin: 0 0 14px;
  }
  .tower{
    background: var(--surface);
    border: 1.5px dashed var(--line);
    border-radius: 14px;
    padding: 10px;
    min-height: 90px;
    margin-bottom: 34px;
    transition: border-color .15s ease;
  }
  .tower-empty{
    text-align: center;
    color: var(--text-dim);
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 15px;
    padding: 30px 10px;
  }
  .tower-row{
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 14px;
    margin-bottom: 7px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 9px;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }
  .tower-row:last-child{ margin-bottom: 0; }
  .tower-row:active{ cursor: grabbing; }
  .tower-row .num{
    font-family: 'Fraunces', serif;
    font-size: 16px;
    color: var(--accent);
    width: 22px;
    flex-shrink: 0;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .tower-row .label{ font-size: 15px; flex: 1; }
  .tower-row .remove{
    background: transparent;
    color: var(--text-dim);
    font-size: 16px;
    line-height: 1;
    padding: 4px 6px;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .tower-row .remove:hover{ color: var(--text); background: var(--line); }

  .pool{
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    min-height: 54px;
    padding: 14px;
    border-radius: 14px;
    background: var(--surface);
    border: 1.5px dashed var(--line);
    transition: border-color .15s ease, background .15s ease;
    margin-bottom: 8px;
  }
  .pool.drag-over{ border-color: var(--accent); background: var(--accent-soft); }
  .pool-empty{
    color: var(--text-dim);
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 14px;
    padding: 6px 4px;
  }
  .pool-box{
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: grab;
    touch-action: none;
    user-select: none;
    transition: border-color .12s ease;
  }
  .pool-box:hover{ border-color: var(--accent-2); }
  .pool-box:active{ cursor: grabbing; }

  .insert-indicator{
    height: 3px;
    background: var(--accent);
    border-radius: 2px;
    margin: 5px 4px;
  }

  .drag-ghost{
    position: fixed;
    z-index: 999;
    pointer-events: none;
    opacity: .92;
    box-shadow: 0 10px 28px rgba(0,0,0,.4);
    transform: rotate(-1.5deg);
  }

  .action-bar{
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 32px;
  }
  .export-row{
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 14px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  .export-row .section-label{
    margin: 0 4px 0 0;
    font-size: 13px;
  }
  .status-text{
    font-size: 12.5px;
    color: var(--text-dim);
    min-height: 16px;
    margin-top: 10px;
  }

  /* ---------- MODAL ---------- */
  .modal-overlay{
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(8, 9, 12, .6);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
  }
  .modal-overlay.active{ display: flex; }
  .modal-card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 26px;
    width: min(480px, 100%);
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
  }
  .modal-card h2{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 20px;
    margin: 0 0 8px;
  }
  .modal-card .modal-hint{
    color: var(--text-dim);
    font-size: 13.5px;
    line-height: 1.55;
    margin: 0 0 16px;
  }
  .modal-card textarea{
    width: 100%;
    min-height: 180px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    line-height: 1.8;
    padding: 14px 16px;
    resize: vertical;
    outline: none;
    transition: border-color .15s ease;
  }
  .modal-card textarea:focus{ border-color: var(--accent); }
  .modal-error{
    color: var(--danger);
    font-size: 13px;
    min-height: 18px;
    margin: 10px 0 0;
    line-height: 1.5;
  }
  .modal-actions{
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 16px;
  }

  @media (max-width: 480px){
    .brand h1{ font-size: 22px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <h1>Ladder</h1>
    <span class="count" id="brandCount"></span>
  </div>

  <p class="section-label">your ladder</p>
  <div class="tower" id="tower"></div>

  <p class="section-label">options</p>
  <div class="pool" id="pool"></div>

  <div class="action-bar">
    <button class="btn-ghost" id="addLadderBtn">Add to ladder</button>
    <button class="btn-ghost" id="addOptionsBtn">Add options</button>
    <button class="btn-ghost" id="clearBtn">Clear tower</button>
  </div>

  <div class="export-row">
    <span class="section-label">copy ladder</span>
    <button class="btn-ghost" id="copyNumberedBtn">Copy numbered</button>
    <button class="btn-ghost" id="copyPlainBtn">Copy plain</button>
  </div>
  <p class="status-text" id="statusText"></p>

</div>

<!-- ============ MODAL: Add options / Add to ladder ============ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <h2 id="modalTitle"></h2>
    <p class="modal-hint" id="modalHint"></p>
    <textarea id="modalInput" spellcheck="false"></textarea>
    <p class="modal-error" id="modalError"></p>
    <div class="modal-actions">
      <button class="btn-ghost" id="modalCancel">Cancel</button>
      <button class="btn-primary" id="modalConfirm">Add</button>
    </div>
  </div>
</div>

<script>
/* ======================================================================
   Optionally pre-fill the pool with items when the page first opens.
   Leave this empty for a blank start — add items with the on-screen
   "Add options" button instead.
   ====================================================================== */
const DEFAULT_ITEMS = [];
/* ====================================================================== */

const el = id => document.getElementById(id);

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ---------------- state ----------------
let nextId = 0;
let pool = DEFAULT_ITEMS.map(text => ({ id: nextId++, text }));  // [{id, text}]
let tower = [];                                                    // [{id, text}]

function render(){
  el('brandCount').textContent = `${tower.length} of ${tower.length + pool.length} placed`;
  renderTower();
  renderPool();
  const noItems = tower.length === 0;
  el('copyNumberedBtn').disabled = noItems;
  el('copyPlainBtn').disabled = noItems;
}

function renderTower(){
  const towerEl = el('tower');
  towerEl.innerHTML = '';
  if(tower.length === 0){
    towerEl.innerHTML = '<div class="tower-empty">Drag items here, or use "Add to ladder" below</div>';
    return;
  }
  tower.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'tower-row';
    row.dataset.id = item.id;
    row.innerHTML = `<span class="num">${i + 1}</span><span class="label">${escapeHtml(item.text)}</span><button class="remove" title="Send back to options">×</button>`;
    towerEl.appendChild(row);
  });
}

function renderPool(){
  const poolEl = el('pool');
  poolEl.innerHTML = '';
  if(pool.length === 0){
    poolEl.innerHTML = '<div class="pool-empty">No unranked options — add some below</div>';
    return;
  }
  pool.forEach(item => {
    const box = document.createElement('div');
    box.className = 'pool-box';
    box.dataset.id = item.id;
    box.textContent = item.text;
    poolEl.appendChild(box);
  });
}

render();

// ---------------- drag and drop (pointer events: mouse + touch) ----------------
const towerEl = el('tower');
const poolEl = el('pool');
const indicator = document.createElement('div');
indicator.className = 'insert-indicator';

let drag = null; // { id, from, sourceEl, ghost, offsetX, offsetY, target, lastX, lastY }

function onPointerDown(e){
  const rowEl = e.target.closest('.tower-row');
  const boxEl = e.target.closest('.pool-box');
  const sourceEl = rowEl || boxEl;
  if(!sourceEl) return;
  if(e.target.closest('.remove')) return; // handled by its own click
  if(e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;

  const id = Number(sourceEl.dataset.id);
  const from = rowEl ? 'tower' : 'pool';
  const rect = sourceEl.getBoundingClientRect();

  const ghost = sourceEl.cloneNode(true);
  ghost.classList.add('drag-ghost');
  ghost.style.width = rect.width + 'px';
  ghost.style.left = rect.left + 'px';
  ghost.style.top = rect.top + 'px';
  document.body.appendChild(ghost);
  ghost.setPointerCapture(e.pointerId);

  sourceEl.style.visibility = 'hidden';

  drag = {
    id, from, sourceEl, ghost,
    offsetX: e.clientX - rect.left,
    offsetY: e.clientY - rect.top,
    target: null,
    lastX: e.clientX,
    lastY: e.clientY
  };

  ghost.addEventListener('pointermove', onPointerMove);
  ghost.addEventListener('pointerup', onPointerUp);
  ghost.addEventListener('pointercancel', onPointerUp);
  requestAnimationFrame(dragLoop);
  e.preventDefault();
}

function onPointerMove(e){
  if(!drag) return;
  drag.lastX = e.clientX;
  drag.lastY = e.clientY;
  drag.ghost.style.left = (e.clientX - drag.offsetX) + 'px';
  drag.ghost.style.top = (e.clientY - drag.offsetY) + 'px';
  updateDropTarget(e.clientX, e.clientY);
}

// Auto-scroll the page when dragging near the top/bottom edge of the
// viewport, so a tall ladder can be reached without letting go.
function dragLoop(){
  if(!drag) return;
  autoScroll(drag.lastY);
  requestAnimationFrame(dragLoop);
}

function autoScroll(y){
  const margin = 90;
  const maxSpeed = 16;
  let dy = 0;
  if(y < margin){
    dy = -maxSpeed * ((margin - y) / margin);
  } else if(y > window.innerHeight - margin){
    dy = maxSpeed * ((y - (window.innerHeight - margin)) / margin);
  }
  if(dy !== 0){
    window.scrollBy(0, dy);
    updateDropTarget(drag.lastX, drag.lastY);
  }
}

function updateDropTarget(x, y){
  drag.ghost.style.display = 'none';
  const atPoint = document.elementFromPoint(x, y);
  drag.ghost.style.display = '';

  const overTower = atPoint && towerEl.contains(atPoint);
  const overPool = atPoint && poolEl.contains(atPoint);

  if(overTower){
    poolEl.classList.remove('drag-over');
    const rows = Array.from(towerEl.querySelectorAll('.tower-row')).filter(r => r.offsetParent !== null);
    let before = null;
    for(const row of rows){
      const rect = row.getBoundingClientRect();
      if(y < rect.top + rect.height / 2){ before = row; break; }
    }
    if(before) towerEl.insertBefore(indicator, before);
    else towerEl.appendChild(indicator);
    drag.target = 'tower';
  } else if(overPool){
    if(indicator.parentNode) indicator.remove();
    poolEl.classList.add('drag-over');
    drag.target = 'pool';
  } else {
    if(indicator.parentNode) indicator.remove();
    poolEl.classList.remove('drag-over');
    drag.target = null;
  }
}

function onPointerUp(e){
  if(!drag) return;
  drag.ghost.releasePointerCapture(e.pointerId);
  drag.ghost.removeEventListener('pointermove', onPointerMove);
  drag.ghost.removeEventListener('pointerup', onPointerUp);
  drag.ghost.removeEventListener('pointercancel', onPointerUp);
  drag.ghost.remove();
  drag.sourceEl.style.visibility = '';
  poolEl.classList.remove('drag-over');

  if(drag.target === 'tower'){
    const children = Array.from(towerEl.children);
    const idx = children.indexOf(indicator);
    const insertIndex = idx === -1
      ? tower.length
      : children.slice(0, idx).filter(c => c.classList.contains('tower-row')).length;
    moveToTower(drag.id, drag.from, insertIndex);
  } else if(drag.target === 'pool'){
    moveToPool(drag.id, drag.from);
  }

  if(indicator.parentNode) indicator.remove();
  drag = null;
  render();
}

function moveToTower(id, from, insertIndex){
  let item;
  if(from === 'tower'){
    const i = tower.findIndex(x => x.id === id);
    item = tower.splice(i, 1)[0];
    if(i < insertIndex) insertIndex--;
  } else {
    const i = pool.findIndex(x => x.id === id);
    item = pool.splice(i, 1)[0];
  }
  insertIndex = Math.max(0, Math.min(insertIndex, tower.length));
  tower.splice(insertIndex, 0, item);
}

function moveToPool(id, from){
  if(from === 'pool') return;
  const i = tower.findIndex(x => x.id === id);
  const item = tower.splice(i, 1)[0];
  pool.push(item);
}

towerEl.addEventListener('pointerdown', onPointerDown);
poolEl.addEventListener('pointerdown', onPointerDown);

// remove button (click straight back to pool, no drag needed)
towerEl.addEventListener('click', e => {
  const btn = e.target.closest('.remove');
  if(!btn) return;
  const row = btn.closest('.tower-row');
  const id = Number(row.dataset.id);
  moveToPool(id, 'tower');
  render();
});

el('clearBtn').addEventListener('click', () => {
  pool = pool.concat(tower);
  tower = [];
  render();
});

// ---------------- modal: Add options / Add to ladder ----------------
let modalMode = null; // 'options' | 'ladder'

function openModal(mode){
  modalMode = mode;
  el('modalError').textContent = '';
  el('modalInput').value = '';
  if(mode === 'options'){
    el('modalTitle').textContent = 'Add options';
    el('modalHint').textContent = 'One item per line. They\u2019ll show up as unranked boxes you can drag into the ladder.';
    el('modalInput').placeholder = 'Item one\nItem two\nItem three';
    el('modalConfirm').textContent = 'Add options';
  } else {
    el('modalTitle').textContent = 'Add to ladder';
    el('modalHint').textContent = 'Paste a numbered list, 1 through X with no gaps. It\u2019s placed at the top of the ladder, pushing whatever\u2019s already there down.';
    el('modalInput').placeholder = '1. Item one\n2. Item two\n3. Item three';
    el('modalConfirm').textContent = 'Add to ladder';
  }
  el('modalOverlay').classList.add('active');
  el('modalInput').focus();
}

function closeModal(){
  el('modalOverlay').classList.remove('active');
  modalMode = null;
}

function existingTexts(){
  return new Set(tower.concat(pool).map(x => x.text.trim().toLowerCase()));
}

function handleModalConfirm(){
  const raw = el('modalInput').value;
  const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);

  if(lines.length === 0){
    el('modalError').textContent = 'Add at least one item.';
    return;
  }

  if(modalMode === 'options'){
    const seen = existingTexts();
    const toAdd = [];
    let skipped = 0;
    for(const line of lines){
      const key = line.toLowerCase();
      if(seen.has(key)){ skipped++; continue; }
      seen.add(key);
      toAdd.push(line);
    }
    if(toAdd.length === 0){
      el('modalError').textContent = 'Those are already in the ladder or options.';
      return;
    }
    const items = toAdd.map(text => ({ id: nextId++, text }));
    pool = pool.concat(items);
    closeModal();
    render();
    setStatus(skipped > 0 ? `Added ${toAdd.length} — skipped ${skipped} duplicate${skipped === 1 ? '' : 's'}.` : '');
    return;
  }

  // modalMode === 'ladder': every line must be numbered 1..X, in order, no gaps.
  const numberedRe = /^(\d+)[.):\-]\s*(.+)$/;
  const parsed = [];
  for(let i = 0; i < lines.length; i++){
    const m = lines[i].match(numberedRe);
    if(!m){
      el('modalError').textContent = `Line ${i + 1} isn\u2019t numbered ("${lines[i]}"). Use "1. Item" style numbering on every line.`;
      return;
    }
    const num = parseInt(m[1], 10);
    if(num !== i + 1){
      el('modalError').textContent = `Expected ${i + 1} but found ${num} on line ${i + 1}. Numbers must run 1 to ${lines.length} in order, with no gaps or repeats.`;
      return;
    }
    parsed.push(m[2].trim());
  }

  const seen = existingTexts();
  const toAdd = [];
  let skipped = 0;
  for(const text of parsed){
    const key = text.toLowerCase();
    if(seen.has(key)){ skipped++; continue; }
    seen.add(key);
    toAdd.push(text);
  }
  if(toAdd.length === 0){
    el('modalError').textContent = 'Those are already in the ladder or options.';
    return;
  }

  const items = toAdd.map(text => ({ id: nextId++, text }));
  tower = items.concat(tower);
  closeModal();
  render();
  setStatus(skipped > 0 ? `Added ${toAdd.length} — skipped ${skipped} duplicate${skipped === 1 ? '' : 's'}.` : '');
}

el('addOptionsBtn').addEventListener('click', () => openModal('options'));
el('addLadderBtn').addEventListener('click', () => openModal('ladder'));
el('modalCancel').addEventListener('click', closeModal);
el('modalConfirm').addEventListener('click', handleModalConfirm);
el('modalOverlay').addEventListener('click', e => { if(e.target === el('modalOverlay')) closeModal(); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && el('modalOverlay').classList.contains('active')) closeModal();
});

// ---------------- copy: put the ladder's text on the clipboard, at any point ----------------
function buildListText(numbered){
  return tower.map((item, i) => numbered ? `${i + 1}. ${item.text}` : item.text).join('\n');
}

function setStatus(msg){ el('statusText').textContent = msg; }

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
  ta.remove();
  return ok;
}

async function copyList(numbered){
  if(tower.length === 0){ setStatus('Add at least one item to the ladder first.'); return; }
  const text = buildListText(numbered);

  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      setStatus('Copied to clipboard.');
      return;
    }
  }catch(e){
    // fall through to fallback below
  }

  if(fallbackCopy(text)){
    setStatus('Copied to clipboard.');
  }else{
    setStatus("Couldn't copy automatically — select and copy manually.");
  }
}

el('copyNumberedBtn').addEventListener('click', () => copyList(true));
el('copyPlainBtn').addEventListener('click', () => copyList(false));
</script>
</body>
</html>
